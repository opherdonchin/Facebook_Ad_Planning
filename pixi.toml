[project]
name = "facebook-ad-planning"
version = "0.1.0"
description = "Export Grist documents with all data, formulas, and attachments"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.8"
requests = ">=2.31.0"
duckdb = ">=1.4.3,<2"
ibis-framework = ">=11.0.0,<12"
pandas = ">=2.3.3,<3"

[tasks]
export_ads = "python src/export_ads.py"
export_ads_no_attachments = "python src/export_ads.py --no-attachments"
sync_leads = "python src/grist_leads_source.py --fb-export"
update_ads = "python src/update_ads_from_leads.py --config config.json"
transform_weekly = "python src/run_transforms.py weekly_metrics_prod lifetime_ad_metrics_prod last_contiguous_run_ad_metrics_prod tag_lifetime_rollups_prod --profile ad_tracking"

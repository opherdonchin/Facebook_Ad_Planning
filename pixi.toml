[workspace]
name = "facebook-ad-planning"
version = "0.1.0"
description = "Export Grist documents with all data, formulas, and attachments"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.8"
requests = ">=2.31.0"
duckdb = ">=1.4.3,<2"
ibis-framework = ">=11.0.0,<12"
pandas = ">=2.3.3,<3"
pyarrow = ">=18.0.0"
pytest = ">=7.0.0"

[tasks]
export_ads = "python src/export_ads_and_structured.py"
export_ads_no_attachments = "python src/export_ads_and_structured.py --no-attachments"
sync_leads = "python src/grist_leads_source.py --fb-export"
update_ads = "python src/update_ads_from_leads.py --config config.json"
update_weekly_runs = "python src/update_weekly_runs.py"
transform_weekly = "python src/run_transforms.py weekly_metrics_prod lifetime_ad_metrics_prod last_contiguous_run_ad_metrics_prod tag_lifetime_rollups_prod component_tags_prod --profile ad_tracking"
package_uploads = "python src/package_weekly_uploads.py"
sync_meta_leads = "python src/sync_meta_leads.py --config config.json"
